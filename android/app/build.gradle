plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
}

android {
    namespace 'com.myliba.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.myliba.android'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.4.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
